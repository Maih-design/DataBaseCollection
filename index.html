<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة القوى البشرية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">تسجيل بيانات القوى البشرية</h3>
            <div id="displayLocation" class="badge bg-light text-primary mt-2 p-2"></div>
        </div>
        <div class="card-body p-4">

            <div id="step1" class="step active">
                <div class="mb-3">
                    <label class="form-label fw-bold">الفرع</label>
                    <select id="branchSelect" class="form-select" onchange="updateCentres()"></select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">المركز</label>
                    <select id="centreSelect" class="form-select"></select>
                </div>
                <button class="btn btn-primary w-100 py-2 fw-bold" onclick="validateStep1()">التالي</button>
            </div>

            <div id="step2" class="step">
                <form id="mainForm">
                    
                    <div class="employee-group border-primary border rounded p-3 mb-4" data-role="مدير طبي">
                        <h5 class="text-primary">المدير الطبي <span class="text-danger">*</span></h5>
                        <small class="text-danger d-block mb-2">في حالة عدم وجود مدير طبي برجاء ادخال بيانات مدير العيادة</small>
                        <div class="row g-3">
                            <div class="col-md-4"><input type="text" class="form-control emp-name" placeholder="الاسم الرباعي" required></div>
                            <div class="col-md-4"><input type="text" class="form-control emp-id" placeholder="الرقم القومي (14 رقم)" maxlength="14" required></div>
                            <div class="col-md-4"><input type="text" class="form-control emp-phone" placeholder="رقم التليفون" required></div>
                        </div>
                    </div>

                    <div id="doctorContainer"></div>
                    <button type="button" class="btn btn-outline-info btn-sm mb-4" onclick="addDoctorRow()">+ إضافة طبيب - مراجع فني</button>

                    <div class="employee-group border rounded p-3 mb-4" data-role="مدير إداري">
                        <h5 class="text-secondary">المدير الإداري</h5>
                        <div class="row g-3">
                            <div class="col-md-4"><input type="text" class="form-control emp-name" placeholder="الاسم"></div>
                            <div class="col-md-4"><input type="text" class="form-control emp-id" placeholder="الرقم القومي" maxlength="14"></div>
                            <div class="col-md-4"><input type="text" class="form-control emp-phone" placeholder="رقم التليفون"></div>
                        </div>
                    </div>

                    <div class="employee-group border rounded p-3 mb-4" data-role="موظف تحصيل">
                        <h5 class="text-secondary">موظف تحصيل</h5>
                        <div class="row g-3">
                            <div class="col-md-4"><input type="text" class="form-control emp-name" placeholder="الاسم"></div>
                            <div class="col-md-4"><input type="text" class="form-control emp-id" placeholder="الرقم القومي" maxlength="14"></div>
                            <div class="col-md-4"><input type="text" class="form-control emp-phone" placeholder="رقم التليفون"></div>
                        </div>
                    </div>

                    <div id="dataEntryContainer"></div>
                    <button type="button" class="btn btn-outline-success btn-sm mb-4" onclick="addDataEntryRow()">+ إضافة مدخل بيانات إضافي</button>
                </form>

                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-secondary px-4" onclick="changeStep(1)">رجوع</button>
                    <button class="btn btn-primary px-4" onclick="validateAndReview()">مراجعة البيانات</button>
                </div>
            </div>

            <div id="step3" class="step">
                <h4 class="text-center mb-4">تأكيد البيانات النهائية</h4>
                <div id="reviewTable" class="table-responsive"></div>
                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-secondary px-4" onclick="changeStep(2)">تعديل</button>
                    <button id="submitBtn" class="btn btn-success px-5 fw-bold" onclick="finalSubmit()">تأكيد وإرسال</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
